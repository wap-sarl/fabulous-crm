stages:
  - build
  - deploy-backend
  - deploy-frontend

# Direct-to-prod on master only. No QA, no tag flow.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - when: never

variables:
  APP_NAME: crm
  STACK_NAME: prod
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  PROXY_NETWORK: prod-proxy

# SSH + Docker deploy helpers
.ssh_init: &ssh_init
  - apk add --no-cache openssh-client
  - eval $(ssh-agent -s)
  - echo "$DEPLOYER_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - ssh-keyscan -p ${SSH_PORT} ${SWARM_MANAGER_HOST} >> ~/.ssh/known_hosts

.docker_login: &docker_login
  - echo "$DOCKER_PASS" | docker login --username "$DOCKER_USER" --password-stdin

.docker_login_from_ssh: &docker_login_from_ssh
  - ssh -p ${SSH_PORT} ${USER}@${SWARM_MANAGER_HOST} "echo '${DOCKER_PASS}' | docker login --username '${DOCKER_USER}' --password-stdin"

.deploy_stack: &deploy_stack
  # Remote filename is namespaced by APP_NAME: the monorepo's deploy already uses
  # /tmp/${STACK_NAME}-stack.yml on the same manager for the shared "prod" stack.
  - scp -P ${SSH_PORT} docker-stack.yml ${USER}@${SWARM_MANAGER_HOST}:/tmp/${APP_NAME}-stack.yml
  - >-
    ssh -p ${SSH_PORT} ${USER}@${SWARM_MANAGER_HOST}
    "DOCKER_REPO='${DOCKER_REPO}' APP_NAME='${APP_NAME}' IMAGE_TAG='${IMAGE_TAG}'
    VITE_CONVEX_URL='${VITE_CONVEX_URL}'
    VITE_CONVEX_SITE_URL='${VITE_CONVEX_SITE_URL}'
    PROXY_NETWORK='${PROXY_NETWORK}'
    docker stack deploy
    --compose-file /tmp/${APP_NAME}-stack.yml
    --with-registry-auth
    --resolve-image always
    ${STACK_NAME}"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - *docker_login
  script:
    - docker build -t ${DOCKER_REPO}/${APP_NAME}:${IMAGE_TAG} -t ${DOCKER_REPO}/${APP_NAME}:latest .
    - docker push ${DOCKER_REPO}/${APP_NAME}:${IMAGE_TAG}
    - docker push ${DOCKER_REPO}/${APP_NAME}:latest

deploy-backend:
  stage: deploy-backend
  image: oven/bun:1.3.9
  script:
    - test -n "$CONVEX_DEPLOY_KEY" || { echo "CONVEX_DEPLOY_KEY not injected — Protected var on an unprotected branch?"; exit 1; }
    - bun install --frozen-lockfile
    - bunx convex deploy -y      # reads CONVEX_DEPLOY_KEY from the environment

deploy-frontend:
  stage: deploy-frontend
  image: docker:latest
  before_script:
    - *ssh_init
  script:
    - *docker_login_from_ssh
    - *deploy_stack
  environment:
    name: production
